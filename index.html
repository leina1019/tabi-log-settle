<!DOCTYPE html>
<html lang="ja">

<head>
  <script>
    window.onerror = function (msg, url, line, col, error) {
      var div = document.createElement('div');
      div.style.position = 'fixed';
      div.style.top = '0';
      div.style.left = '0';
      div.style.width = '100%';
      div.style.height = '100%';
      div.style.backgroundColor = 'white';
      div.style.color = 'red';
      div.style.zIndex = '9999';
      div.style.padding = '20px';
      div.style.overflow = 'auto';
      div.innerHTML = '<h2>Global Error Detected</h2>' +
        '<p><b>Message:</b> ' + msg + '</p>' +
        '<p><b>Source:</b> ' + url + ' (Line: ' + line + ', Col: ' + col + ')</p>' +
        '<p><b>Stack:</b> ' + (error ? error.stack : 'N/A') + '</p>' +
        '<button onclick="location.reload()" style="padding: 10px; background: #003780; color: white; border: none; border-radius: 8px;">Reload</button>';
      document.body ? document.body.appendChild(div) : window.onload = function () { document.body.appendChild(div); };
      return false;
    };
    window.onunhandledrejection = function (event) {
      console.error('Unhandled Promise Rejection:', event.reason);
    };
  </script>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=0">
  <title>たびログ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // === プライマリー（Ocean Dark 濃紺系） ===
            primary: '#003780',
            'primary-dark': '#002a60',
            'primary-light': '#F4F7FA',
            // === サーフェス ===
            surface: {
              DEFAULT: '#FFFFFF',
              gray: '#F4F7FA',
              'gray-mid': '#E2E8F0',
            },
            // === テキスト ===
            ink: {
              DEFAULT: '#1A2B4A',
              sub: '#5A7184',
              light: '#94A3B8',
            },
            // === アクセント（ゴールド） ===
            accent: {
              DEFAULT: '#CFA86E',
              light: '#E5CCA0',
            },
            // === 既存エイリアス（後方互換） ===
            ocean: {
              dark: '#003780',
              DEFAULT: '#0055aa',
              light: '#00A1DE',
            },
            premium: {
              gold: '#CFA86E',
              goldLight: '#E5CCA0',
            }
          },

            sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
            serif: ['"Playfair Display"', '"Noto Sans JP"', 'serif'],
            mono: ['"Inter"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    html,

      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior-y: none;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;

      color: #1A2B4A;

      padding: 0;

    /* Card / Glass Utilities */
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 161, 222, 0.12);
      box-shadow: 0 2px 16px rgba(0, 119, 182, 0.06);
    }

    .glass-dark {
      background: rgba(0, 55, 128, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 55, 128, 0.12);
    }

    .safe-pb {
